# Continuous differential fuzzing of inflate, which is where zlib's CVEs have been.
#
# Every run generates a fresh batch: the reference compresses 3000 randomized payloads across
# levels and framings, damages a share of them, and both libraries decode every stream under
# six chunking patterns - 18,000 probes per run. The seed comes from the run id and is printed
# in the log, so any failing batch can be regenerated exactly with
# `scripts/run_fuzz.sh build/cmake/libz.so.1.3.1 <seed>`.
#
# Unlike the benchmark this is a gate: the verdicts must match probe for probe, and accepted
# streams must decode to identical bytes. The nightly schedule is what makes it *continuous* -
# streams keep changing after the code has stopped.

name: Fuzz

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

jobs:
  differential:
    name: Differential fuzz against the reference
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4

      - run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build gcc make python3

      # Pinned by building it, exactly as ci.yml pins it: noble ships 1.3, and behaviour is
      # compared against 1.3.1.
      - name: Build the reference zlib 1.3.1
        run: |
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git /tmp/zlib
          cd /tmp/zlib
          ./configure
          make -j"$(nproc)"
          make install
          ldconfig

      - run: cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/cmake

      - name: Fuzz a fresh batch
        run: ./scripts/run_fuzz.sh build/cmake/libz.so.1.3.1 "$GITHUB_RUN_ID"
