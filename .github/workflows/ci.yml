# The Linux claims: the export list has to match the reference symbol for symbol, and the
# behaviour has to match it call for call. Both are easy to break from an ordinary desktop
# build without noticing, which is the whole reason they are scripts rather than paragraphs.
#
# This workflow is Linux only because the conformance is: the reference to compare against
# lives here, and so does the installable libz.so.1. The other platforms the engine builds
# for each have a workflow of their own — macos.yml, windows.yml, android.yml — and the
# no-operating-system configuration has embedded.yml.

name: CI

on:
  push:
  workflow_dispatch:

jobs:
  # arm64 runs on a real hosted ARM64 machine, not a cross-compilation target: the tests
  # execute, which matters for an engine full of width-sensitive bit arithmetic.
  test:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  # musl instead of Glibc — the libc of Alpine and of Swift's fully static Linux binaries,
  # and a different Swift platform module, so nothing short of building against it proves
  # the platform seams are right. The build is statically linked, so the host can run the
  # test suite for real despite being a Glibc system.
  musl:
    name: Build and test (musl, static)
    runs-on: ubuntu-latest
    # Pinned to the SDK's exact toolchain, not a floating tag: a Swift SDK's modules are only
    # importable by the compiler version that built them.
    container: swift:6.3.3-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install the static Linux SDK
        run: >
          swift sdk install
          "https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz"
          --checksum 87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b
      - name: Build the package and its tests
        run: swift build --build-tests --swift-sdk x86_64-swift-linux-musl
      - name: Test
        run: .build/x86_64-swift-linux-musl/debug/swift-zlibPackageTests.xctest --testing-library swift-testing

  conformance:
    name: Conformance against the system libz
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4

      # The reference to compare against, and the tools the checks are built with.
      - run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build gcc zlib1g-dev python3
      - run: cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/cmake

      # Exactly the reference's symbols under the reference's version nodes — no name missing,
      # and none of the Swift symbols a naive link would publish.
      - run: ./scripts/check_exports.sh

      # Every entry point compared against the reference, call for call.
      - run: ./scripts/run_conformance.sh build/cmake/libz.so.1.3.1

      # zlib's own test programs, built against this library unmodified.
      - name: zlib's own test suite
        run: |
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git /tmp/zlib
          cc -O1 -I Sources/CZlib/include -o /tmp/example \
            /tmp/zlib/test/example.c build/cmake/libz.so.1.3.1 \
            -Wl,-rpath,"$PWD/build/cmake"
          cc -O1 -I Sources/CZlib/include -o /tmp/minigzip \
            /tmp/zlib/test/minigzip.c build/cmake/libz.so.1.3.1 \
            -Wl,-rpath,"$PWD/build/cmake"
          /tmp/example
          # Compressed here and read by the reference's own tool, and the reverse.
          head -c 2000000 /dev/urandom > /tmp/payload
          cat /tmp/zlib/*.c >> /tmp/payload
          /tmp/minigzip < /tmp/payload > /tmp/ours.gz
          gzip -dc /tmp/ours.gz | cmp - /tmp/payload
          gzip -c /tmp/payload > /tmp/theirs.gz
          /tmp/minigzip -d < /tmp/theirs.gz | cmp - /tmp/payload
